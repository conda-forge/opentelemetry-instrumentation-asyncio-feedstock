# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 0.66b1

package:
  name: opentelemetry-instrumentation-asyncio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-asyncio/opentelemetry_instrumentation_asyncio-${{ version }}.tar.gz
  sha256: c2a593daee5eadd487fd08608b506da25f8e3805cbce1d5595097f8b427991d0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.14,<2.dev0
    - opentelemetry-instrumentation ==${{ version }}
    - opentelemetry-semantic-conventions ==${{ version }}
    - wrapt >=1.0.0,<3.0.0
    - opentelemetry-semantic-conventions ==0.66b1
    - opentelemetry-instrumentation ==0.66b1
tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.instrumentation.asyncio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-asyncio
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry instrumentation for asyncio
  description: |
    OpenTelemetry instrumentation for asyncio
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib

extra:
  recipe-maintainers:
    - rxm7706
    - conda-forge/opentelemetry-api
